[project]
name = "mnist-ml"
version = "0.1.0"
description = "Identifies digits from the mnist digit dataset."
readme = "README.md"
authors = [
    { name = "Nathan Miguel" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
mnist-ml = "mnist_ml:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
